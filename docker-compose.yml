services:
  thumalien:
    build: .
    container_name: thumalien
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # persiste base, modeles et logs energie hors du conteneur
      - ./data:/app/data
      - ./models:/app/models
      - ./energy_logs:/app/energy_logs
    restart: unless-stopped

